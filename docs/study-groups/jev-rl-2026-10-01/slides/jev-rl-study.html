function header(slide, index) {
  const inverse = slide.tone === dark;
  const rule = inverse ? 'border-fog/35 text-fog' : 'border-field text-faint';
  const tag = inverse ? 'text-leaf' : 'text-agro';
  const titleTop = index === 0 ? 'top-[500px]' : 'top-[150px]';
  return "<div class='absolute left-[84px] top-[60px] right-[84px] flex items-center justify-between border-b "+rule+" pb-[22px]'><p class='font-mono text-[16px] tracking-[0.17em] "+tag+"'>"+slide.tag+"</p><p class='font-mono text-[15px] tracking-[0.12em] "+(inverse ? 'text-fog' : 'text-faint')+"'>"+slide.kind+"</p></div><h1 data-editable class='reveal absolute left-[84px] "+titleTop+" max-w-[1460px] font-display text-[76px] font-bold leading-[0.93]'>"+slide.title+"</h1>";
}
function lead(slide) {
  if (!slide.lead) return '';
  const tone = slide.tone === dark ? 'text-fog' : 'text-agro';
  const leadTop = slide.layout === 'opening/dossier' ? 'top-[720px]' : 'top-[300px]';
  return "<p data-editable class='reveal absolute left-[84px] "+leadTop+" max-w-[900px] font-body text-[28px] leading-[1.45] "+tone+"'>"+slide.lead+"</p>";
}
function footer(slide, index) {
  const inverse = slide.tone === dark;
  return "<p class='absolute bottom-[50px] left-[84px] font-mono text-[14px] tracking-[0.11em] "+(inverse ? 'text-fog' : 'text-faint')+"'>"+slide.source+"</p><p class='absolute bottom-[50px] right-[84px] font-mono text-[14px] tracking-[0.11em] "+(inverse ? 'text-fog' : 'text-faint')+"'>"+String(index + 1).padStart(2,'0')+" / "+String(slides.length).padStart(2,'0')+"</p>";
}
document.getElementById('deckStage').innerHTML = slides.map(function(slide, index) {
  return "<section class='slide "+slide.tone+"'>"+header(slide,index)+lead(slide)+slide.body+footer(slide,index)+"</section>";
}).join('');

class SlidePresentation {
  constructor() {
    this.slides = Array.from(document.querySelectorAll('.slide'));
    this.current = 0;
    this.stage = document.getElementById('deckStage');
    this.editing = false;
    this.scale();
    this.bind();
    this.show(this.startSlide());
  }
  startSlide() {
    const number = Number(new URLSearchParams(location.search).get('slide'));
    return Number.isFinite(number) && number > 0 ? number - 1 : 0;
  }
  scale() {
    const factor = Math.min(innerWidth / 1920, innerHeight / 1080);
    this.stage.style.transform = 'translate(' + ((innerWidth - 1920 * factor) / 2) + 'px,' + ((innerHeight - 1080 * factor) / 2) + 'px) scale(' + factor + ')';
  }
  bind() {
    addEventListener('resize', () => this.scale());
    document.getElementById('prevBtn').addEventListener('click', () => this.show(this.current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => this.show(this.current + 1));
    document.getElementById('notesBtn').addEventListener('click', () => document.getElementById('notesPanel').classList.toggle('visible'));
    document.getElementById('editBtn').addEventListener('click', () => this.toggleEdit());
    document.addEventListener('keydown', event => {
      if (event.target.isContentEditable) return;
      if (['ArrowRight',' ','PageDown'].includes(event.key)) { event.preventDefault(); this.show(this.current + 1); }
      if (['ArrowLeft','PageUp'].includes(event.key)) { event.preventDefault(); this.show(this.current - 1); }
      if (event.key.toLowerCase() === 'n') document.getElementById('notesPanel').classList.toggle('visible');
      if (event.key.toLowerCase() === 'e') this.toggleEdit();
    });
    let start = null;
    addEventListener('touchstart', event => { start = event.changedTouches[0].clientX; }, {passive:true});
    addEventListener('touchend', event => { if (start === null) return; const delta = event.changedTouches[0].clientX - start; if (Math.abs(delta) > 60) this.show(this.current + (delta < 0 ? 1 : -1)); start = null; }, {passive:true});
  }
  toggleEdit() {
    this.editing = !this.editing;
    document.querySelectorAll('[data-editable]').forEach(node => {
      node.contentEditable = this.editing ? 'true' : 'false';
      node.classList.toggle('outline', this.editing);
      node.classList.toggle('outline-2', this.editing);
      node.classList.toggle('outline-sun', this.editing);
      node.classList.toggle('outline-offset-8', this.editing);
    });
    document.getElementById('editBtn').classList.toggle('text-[#FCC931]', this.editing);
  }
  show(index) {
    this.current = Math.max(0, Math.min(index, this.slides.length - 1));
    this.slides.forEach((slide, i) => { slide.classList.toggle('active', i === this.current); slide.classList.toggle('visible', i === this.current); });
    document.getElementById('pageIndicator').textContent = String(this.current + 1).padStart(2,'0') + ' / ' + String(this.slides.length).padStart(2,'0');
    document.getElementById('notesText').textContent = slides[this.current].notes;
    history.replaceState(null, '', location.pathname + '?slide=' + (this.current + 1));
  }
}
new SlidePresentation();
</script>
