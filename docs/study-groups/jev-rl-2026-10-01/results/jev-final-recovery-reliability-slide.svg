<rect x="72" y="792" width="1456" height="28" rx="8" fill="#fce6df"/>
<text x="96.0" y="813.0" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a43d32">Diagonal tracejada = calibracao ideal. Jev ainda teve CANCEL -&gt; CONFIRM; nao usar o grafico como selo de seguranca.</text>
<line x1="72" y1="820" x2="1528" y2="820" stroke="#d5d2c2"/>
<text x="72.0" y="852.0" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#69745f">n=60, corpus sintetico pareado, uma rodada remota</text>
