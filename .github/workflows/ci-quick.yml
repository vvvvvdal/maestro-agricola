name: CI quick

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Python, AI and portable bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install portable test dependencies
        run: python -m pip install --requirement tools/requirements-dev.txt

      - name: Validate canonical intent model
        run: python tools/train_intent_model.py --check

      - name: Validate QA-04 evidence matrix
        run: python tools/check_qa04_evidence.py

      - name: Run portable test suites
        run: >-
          python -m unittest discover
          -s tests/portable -t . -p 'test_*.py'

      - name: Run portable bridge tests
        env:
          PYTHONPATH: robot_ws/src/maestro_robot_bridge
        run: >-
          python -m unittest discover
          -s robot_ws/src/maestro_robot_bridge/test
          -p 'test_*.py'

  android-mock:
    name: Android mock
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository and llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/app/*.gradle.kts
            mobile/android/gradle/libs.versions.toml
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install pinned Android components
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;29.0.13113456"
          "cmake;3.31.6"

      - name: Validate pinned llama.cpp submodule
        run: |
          expected="873e5d8e39feb34a376e0efd01bf3f665dfffeb5"
          actual="$(git -C mobile/android/third_party/llama.cpp rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::llama.cpp must be pinned at $expected, found $actual"
            exit 1
          fi

      - name: Run mock unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testMockDebugUnitTest --no-daemon --stacktrace

      - name: Assemble mock APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleMockDebug --no-daemon --stacktrace

      - name: Publish mock debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maestro-mock-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/mock/debug/app-mock-debug.apk
          if-no-files-found: error
          retention-days: 7
