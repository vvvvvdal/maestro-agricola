name: maestro-agricola

services:
  simulation:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      TURTLEBOT4_MODEL: ${TURTLEBOT4_MODEL:-standard}
      MAESTRO_WS_HOST: ${MAESTRO_WS_HOST:-0.0.0.0}
      MAESTRO_WS_PORT: ${MAESTRO_WS_PORT:-8765}
      MAESTRO_ROBOT_NAMESPACE: ${MAESTRO_ROBOT_NAMESPACE:-/turtlebot1}
      MAESTRO_HEADLESS: ${MAESTRO_HEADLESS:-1}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    stdin_open: true
    tty: true
    command:
      - ros2
      - launch
      - maestro_simulation
      - demo.launch.py
      - namespace:=turtlebot1
      - world:=warehouse
      - websocket_port:=${MAESTRO_WS_PORT:-8765}
