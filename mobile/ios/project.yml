name: MaestroAgricola
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    exactVersion: 0.9.0
targets:
  MaestroAgricola:
    type: application
    platform: iOS
    sources:
      - path: MaestroAgricola
      - path: ../../shared/ai/intent_model.json
        buildPhase: resources
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.org.agroturtles.maestro
        PRODUCT_NAME: Maestro Agrícola
        PRODUCT_MODULE_NAME: MaestroAgricola
        INFOPLIST_FILE: MaestroAgricola/Info.plist
        SWIFT_VERSION: "6.3"
        IPHONEOS_DEPLOYMENT_TARGET: "17.2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        META_APP_ID: ""
        CLIENT_TOKEN: ""
  MaestroAgricolaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaestroAgricolaTests
      - path: ../../shared/ai/intent_model.json
        buildPhase: resources
      - path: ../../shared/ai/parity_cases.json
        buildPhase: resources
    dependencies:
      - target: MaestroAgricola
    settings:
      base:
        SWIFT_VERSION: "6.3"
